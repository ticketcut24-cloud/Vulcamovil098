<title>MR Vulcanizadora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8EDF8;--card:#fff;--ink:#0B1A3F;--mut:#55628A;--line:#CBD5EC;--acc:#FFC400;--hd:#0B2573;--pos:#1F7A56;--neg:#B3361F;--inp:#F3F6FD;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1226;--card:#131C3A;--ink:#E8EEFB;--mut:#9DABD0;--line:#26346A;--hd:#071A57;--pos:#4CC38A;--neg:#F07A62;--inp:#0F1730;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1226;--card:#131C3A;--ink:#E8EEFB;--mut:#9DABD0;--line:#26346A;--hd:#071A57;--pos:#4CC38A;--neg:#F07A62;--inp:#0F1730;color-scheme:dark}
*{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--hd);color:#fff;padding:12px 16px;border-bottom:4px solid var(--acc)}header img{width:60px;height:60px;border-radius:10px;border:2px solid var(--acc);flex:none}header a{margin-left:auto;color:var(--acc);font-weight:700;text-decoration:none}
header b{font:700 26px/1 "Barlow Condensed",Impact,sans-serif;letter-spacing:.02em}
header span{display:block;color:#AEBCE6;font-size:14px;margin-top:2px}
main{max-width:640px;margin:0 auto;padding:16px}
h2{font:700 30px/1.1 "Barlow Condensed",Impact,sans-serif;margin:4px 0 14px}
h3{font:600 20px/1.2 "Barlow Condensed",Impact,sans-serif;margin:20px 0 8px}h4{font:700 21px/1.2 "Barlow Condensed",Impact,sans-serif;margin:16px 0 6px;border-left:6px solid var(--acc);padding-left:8px}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;min-height:50px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--inp)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
input[type=checkbox]{width:26px;min-height:26px;accent-color:var(--pos)}
.chk{display:flex;align-items:center;gap:10px;font-weight:500}
.btn{display:block;width:100%;min-height:54px;margin-top:14px;border:0;border-radius:8px;background:var(--acc);color:#0B1A3F;font-weight:700;font-size:18px;cursor:pointer}
.btn.s{background:transparent;border:1.5px solid var(--line);color:var(--ink);font-weight:600;min-height:44px;margin:0;width:auto;padding:0 14px;font-size:15px}
.btn.d{color:var(--neg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sv{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.sv:last-child{border:0}
.sv small,.mut{color:var(--mut);font-size:14px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:46px;height:46px;border-radius:8px;border:1.5px solid var(--line);background:var(--inp);font-size:24px;font-weight:700;cursor:pointer}
.step span{min-width:26px;text-align:center;font-weight:700;font-size:20px}
.tot{background:var(--hd);color:#fff;border-radius:10px;padding:12px 16px;margin-top:16px}
.tot div{display:flex;justify-content:space-between;gap:10px;padding:3px 0;color:#C9D6F5}
.tot .t{border-top:1px solid #3A5BB5;margin-top:6px;padding-top:8px;color:#fff;align-items:baseline}
.tot .t b{font:700 38px/1 "Barlow Condensed",Impact,sans-serif;color:var(--acc)}
.pill{font-size:14px;font-weight:600;padding:2px 10px;border-radius:99px;border:1.5px solid}
.pill.ok{color:var(--pos)}.pill.no{color:var(--neg)}
.big{font:700 34px/1 "Barlow Condensed",Impact,sans-serif}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .card{margin:0}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;margin-top:6px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:13px;color:var(--mut)}
.bars i{display:block;width:100%;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
.hb{height:10px;background:var(--acc);border-radius:5px;margin-top:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--hd);padding-bottom:env(safe-area-inset-bottom,0px);border-top:3px solid var(--acc)}
nav button{flex:1;min-height:60px;border:0;background:none;color:#AEBCE6;font-weight:600;font-size:13px;padding:0;cursor:pointer}
nav button.on{color:var(--acc);box-shadow:inset 0 -4px 0 var(--acc)}
#ts{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
#ts.on{opacity:1}
.hint{border-left:5px solid var(--acc);background:var(--card);padding:10px 12px;border-radius:0 8px 8px 0;margin-bottom:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#lk{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
#lk[hidden]{display:none}
.lkb{width:100%;max-width:360px;text-align:center}
.lkt{display:block;font:700 30px/1.1 "Barlow Condensed",Impact,sans-serif;letter-spacing:.02em;margin-bottom:14px}
.lkb input{text-align:center;font-size:24px;letter-spacing:.3em}
.lkb label{display:block;text-align:left;margin-top:12px}
.lkm{min-height:24px;margin-top:12px;color:var(--neg);font-weight:600}
header button{background:transparent;border:1.5px solid var(--acc);color:var(--acc);border-radius:8px;min-height:40px;padding:0 12px;font-weight:700;cursor:pointer}
</style>

 const b=await tkImg(o,t);

 }

const V={q:vQ,j:vJ,c:vC,g:vG,r:vR,a:vA};

$('#nv').innerHTML=T.map(t=>'<button data-a="tab" data-id="'+t[0]+'"'+(t[0]==tab?' class="on" aria-current="page"':'')+'>'+t[1]+'</button>').join('');
$('#v').innerHTML=V[tab]();window.scrollTo(0,0)}

document.addEventListener('input',e=>{const t=e.target;
if(t.id=='qc')q.c=t.value;else if(t.id=='qk')q.k=t.value;else if(t.id=='qr')q.r=t.checked;else if(t.id=='qn')q.n=t.value;else if(t.id=='qp')q.p=t.checked;else if(t.id=='qx')q.x=t.checked;else return;updQ()});
document.addEventListener('input',e=>{const t=e.target;
if(t.dataset.cfg){S.cfg[t.dataset.cfg]=t.dataset.cfg=='sym'?t.value:Math.max(0,+t.value||0);save()}
else if(t.dataset.cat){const c=S.cats.find(x=>x.id==t.dataset.cat);if(c&&t.value.trim()){c.name=t.value.trim();save()}}
else if(t.dataset.sv){const s=S.svc.find(x=>x.id==t.dataset.sv);if(s){s[t.dataset.f]=t.dataset.f=='price'?Math.max(0,+t.value||0):t.value;save()}}});
document.addEventListener('change',e=>{const t=e.target;
if(t.id=='bf'){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!okData(d))throw 0;{const pn=S.pin;S=d;if(!S.pin)S.pin=pn}S.exp=S.exp||[];mig();save();render();toast('Datos restaurados')}catch(x){toast('El archivo no es válido')}};r.readAsText(f);t.value='';return}
if(t.dataset.cfg){S.cfg[t.dataset.cfg]=t.dataset.cfg=='sym'?t.value:Math.max(0,+t.value||0);save();toast('Guardado')}
else if(t.dataset.cat){const c=S.cats.find(x=>x.id==t.dataset.cat);if(c&&t.value.trim()){c.name=t.value.trim();save();toast('Guardado')}}
else if(t.dataset.sv){const s=S.svc.find(x=>x.id==t.dataset.sv);if(s){s[t.dataset.f]=t.dataset.f=='price'?Math.max(0,+t.value||0):t.value;save();toast('Guardado')}}});

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;

if(el.classList.contains('d')&&a.startsWith('del')){if(el.dataset.s!=='1'){const o=el.textContent;el.dataset.s='1';el.textContent='Toca otra vez';setTimeout(()=>{el.dataset.s='';el.textContent=o},3000);return}}
if(a=='tab'){tab=id;render()}
else if(a=='inc'||a=='dec'){q.qty[id]=Math.max(0,(q.qty[id]||0)+(a=='inc'?1:-1));updQ()}

else if(a=='delcli'){S.cli=S.cli.filter(x=>x.id!=id);save();render()}

else if(a=='delcat'){if(S.cats.length<2){toast('Debe quedar al menos una categoría');return}const f=S.cats.find(c=>c.id!=id).id;S.svc.forEach(s=>{if(s.cat==id)s.cat=f});S.cats=S.cats.filter(c=>c.id!=id);save();render();toast('Servicios movidos a '+catN(f))}
else if(a=='addsv'){const n=$('#sn').value.trim();if(!n){toast('Escribe el nombre');return}S.svc.push({id:uid(),name:n,cat:$('#sk').value,price:Math.max(0,+$('#sp').value||0)});save();render();toast('Servicio agregado')}
else if(a=='delsv'){S.svc=S.svc.filter(x=>x.id!=id);delete q.qty[id];save();render()}

else if(a=='waj'){const j=S.jobs.find(x=>x.id==id);if(j)sendTk(ph(j.c),j,'Recibo')}

else if(a=='delexp'){S.exp=S.exp.filter(x=>x.id!=id);save();render()}
else if(a=='lock'){if(!ready)return;gate()}
else if(a=='setpin'){const v=$('#lp1').value,w=$('#lp2').value;if(!pinOk(v)){lkView('El PIN debe tener de 4 a 6 números');return}if(v!==w){lkView('Los dos PIN no son iguales');return}S.pin=hp(v);save();unlock();toast('PIN guardado')}
else if(a=='unlock'){const v=$('#lp1').value;if(Date.now()<lockUntil){lkView('Espera unos segundos e intenta de nuevo');return}if(S.pin&&hp(v)==S.pin){fails=0;unlock()}else{fails++;if(fails>=5){fails=0;lockUntil=Date.now()+30000;lkView('Demasiados intentos. Espera 30 segundos.')}else lkView('PIN incorrecto')}}
else if(a=='forgot'){lkView('','forgot')}
else if(a=='lkback'){lkView()}
else if(a=='delall'){try{localStorage.removeItem(K)}catch(x){}S=load();S.exp=[];mig();save();lkView()}
else if(a=='chpin'){const o=$('#pc').value,n=$('#pn').value,m=$('#pn2').value;if(S.pin&&hp(o)!=S.pin){toast('El PIN actual no es correcto');return}if(!pinOk(n)){toast('El PIN nuevo debe tener de 4 a 6 números');return}if(n!==m){toast('Los dos PIN nuevos no son iguales');return}S.pin=hp(n);save();['#pc','#pn','#pn2'].forEach(s=>$(s).value='');toast('PIN cambiado')}
else if(a=='dl'){try{const b=new Blob([JSON.stringify(S)],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download='respaldo-vulcanizadora-'+td()+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Archivo descargado')}catch(x){toast('No se pudo descargar')}}
else if(a=='ld'){$('#bf').click()}

});
